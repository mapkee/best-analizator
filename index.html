<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>analyzator</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 55%, #020617 100%);
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 12px;
    box-sizing: border-box;
  }
  .logo {
    margin: 0 0 14px;
    font-size: 2.1rem;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: lowercase;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 20px rgba(129, 140, 248, 0.35);
  }
  .board-wrap {
    position: relative;
    width: min(92vw, 456px);
    height: min(92vw, 456px);
    border: 4px solid rgba(148, 163, 184, 0.25);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    height: 100%;
    user-select: none;
  }
  .cell { display: flex; align-items: center; justify-content: center; position: relative; }
  .light { background: #e2e8f0; }
  .dark { background: #475569; cursor: pointer; }
  .selected { box-shadow: inset 0 0 0 4px #facc15; }
  .must-capture { box-shadow: inset 0 0 0 3px #f43f5e; }
  .piece {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    box-shadow: 0 4px 8px rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.35rem;
    pointer-events: none;
    z-index: 2;
  }
  .white { background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1); color: #0f172a; border: 2px solid #94a3b8; }
  .black { background: radial-gradient(circle at 30% 30%, #334155, #090d16); color: #38bdf8; border: 2px solid #020617; }
  svg.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .controls {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 465px;
    background: rgba(30, 41, 59, 0.55);
    backdrop-filter: blur(10px);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.15);
  }
  button, select {
    padding: 10px 14px;
    font-size: 0.92rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  .btn-go { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
  .btn-sec { background: #334155; color: #f1f5f9; }
  select { background: #1e293b; color: #f8fafc; border: 1px solid #475569; }
  .status { margin-top: 12px; font-size: 0.96rem; color: #38bdf8; text-align: center; min-height: 22px; font-weight: 500; }
</style>
</head>
<body>

<h1 class="logo">analyzator</h1>

<div class="board-wrap">
  <div class="board" id="board"></div>
  <svg class="overlay" viewBox="0 0 800 800">
    <defs>
      <marker id="ah" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto">
        <polygon points="0 0, 6 3, 0 6" fill="#10b981" />
      </marker>
    </defs>
    <g id="arrows"></g>
  </svg>
</div>

<div class="controls">
  <select id="myColorSelect" onchange="changeMyColor()">
    <option value="1">Я играю: Белыми (внизу)</option>
    <option value="-1">Я играю: Черными (внизу)</option>
  </select>
  <button class="btn-go" onclick="findBestMove()">Подсказать ход</button>
  <button class="btn-sec" onclick="undoMove()">Назад</button>
  <button class="btn-sec" onclick="resetBoard()">Сброс</button>
  <button class="btn-sec" id="editBtn" onclick="toggleEdit()">Расстановка: ВЫКЛ</button>
</div>
<div class="status" id="status"></div>

<script>
let board = new Array(), turn = 1, myColor = 1, selected = null, bestHint = null, editMode = false, history = new Array();
const MAX_DEPTH = 8;
const ALL_DIRS = new Array(new Array(-1, -1), new Array(-1, 1), new Array(1, -1), new Array(1, 1));
const W_DIRS = new Array(new Array(-1, -1), new Array(-1, 1));
const B_DIRS = new Array(new Array(1, -1), new Array(1, 1));

function saveHistory() {
  history.push({ board: board.map(r => r.slice()), turn: turn });
  if (history.length > 60) history.shift();
}

function undoMove() {
  if (!history.length) return setStatus("Нечего отменять.");
  const prev = history.pop();
  board = prev.board; turn = prev.turn; selected = null; bestHint = null;
  setStatus(turn === 1 ? "Ход белых." : "Ход черных.");
  render();
  if (turn === myColor && !editMode) findBestMove();
}

function resetBoard() {
  board = Array.from({ length: 8 }, () => Array(8).fill(0));
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if ((r + c) % 2 === 1) {
        if (r < 3) board.at(r)[c] = -1;
        else if (r > 4) board.at(r)[c] = 1;
      }
    }
  }
  turn = 1; history = new Array(); selected = null; bestHint = null;
  setStatus(turn === myColor ? "Ваш ход." : "Сделайте ход белых на доске.");
  render();
  if (turn === myColor) findBestMove();
}

function changeMyColor() {
  myColor = parseInt(document.getElementById('myColorSelect').value, 10);
  selected = null; bestHint = null;
  render();
  if (turn === myColor && !editMode) findBestMove();
  else if (!editMode) setStatus("Сделайте ход соперника на доске.");
}

function toggleEdit() {
  editMode = !editMode; selected = null; bestHint = null;
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? "Расстановка: ВКЛ" : "Расстановка: ВЫКЛ";
  btn.style.background = editMode ? "#f59e0b" : "#334155";
  btn.style.color = editMode ? "#000" : "#f1f5f9";
  if (!editMode) {
    turn = myColor;
    setStatus("Ваш ход.");
    render();
    findBestMove();
  } else {
    setStatus("Кликайте по темным клеткам: Белая → Дамка → Черная → Дамка → Пусто");
    render();
  }
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function toScreen(r, c) { return myColor === 1 ? { sr: r, sc: c } : { sr: 7 - r, sc: 7 - c }; }
function toBoard(sr, sc) { return myColor === 1 ? { r: sr, c: sc } : { r: 7 - sr, c: 7 - sc }; }

function drawArrow(move) {
  const g = document.getElementById('arrows');
  g.innerHTML = '';
  if (!move) return;
  const pts = new Array(move.from, ...(move.path || new Array()), move.to);
  for (let i = 0; i < pts.length - 1; i++) {
    const p1 = toScreen(pts.at(i).r, pts.at(i).c), p2 = toScreen(pts.at(i + 1).r, pts.at(i + 1).c);
    const line = document.createElementNS("http://w3.org", "line");
    line.setAttribute("x1", p1.sc * 100 + 50); line.setAttribute("y1", p1.sr * 100 + 50);
    line.setAttribute("x2", p2.sc * 100 + 50); line.setAttribute("y2", p2.sr * 100 + 50);
    line.setAttribute("stroke", "#10b981"); line.setAttribute("stroke-width", "16");
    line.setAttribute("stroke-linecap", "round"); line.setAttribute("opacity", "0.92");
    if (i === pts.length - 2) line.setAttribute("marker-end", "url(#ah)");
    g.appendChild(line);
  }
}

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  const legal = !editMode ? getLegalMoves(board, turn) : new Array();
  const mustCap = legal.some(m => m.captured.length > 0) ? legal.map(m => `${m.from.r},${m.from.c}`) : new Array();

  for (let sr = 0; sr < 8; sr++) {
    for (let sc = 0; sc < 8; sc++) {
      const { r, c } = toBoard(sr, sc);
      const cell = document.createElement('div');
      const isDark = (r + c) % 2 === 1;
      cell.className = 'cell ' + (isDark ? 'dark' : 'light');
      if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
      else if (mustCap.includes(`${r},${c}`)) cell.classList.add('must-capture');

      const p = board.at(r).at(c);
      if (p !== 0) {
        const piece = document.createElement('div');
        piece.className = 'piece ' + (p > 0 ? 'white' : 'black');
        if (Math.abs(p) === 2) piece.textContent = '♛';
        cell.appendChild(piece);
      }
      if (isDark) cell.onclick = () => onCellClick(r, c);
      el.appendChild(cell);
    }
  }
  drawArrow(bestHint);
}

function onCellClick(r, c) {
  if (editMode) {
    const seq = new Array(0, 1, 2, -1, -2);
    board.at(r)[c] = seq.at((seq.indexOf(board.at(r).at(c)) + 1) % 5);
    return render();
  }
  const p = board.at(r).at(c);
  if (p !== 0 && Math.sign(p) === turn) {
    selected = { r, c };
    return render();
  }
  if (selected) {
    const moves = getLegalMoves(board, turn);
    const chosen = moves.find(m => m.from.r === selected.r && m.from.c === selected.c && m.to.r === r && m.to.c === c);
    if (chosen) {
      saveHistory();
      board = applyMove(board, chosen);
      turn = -turn; selected = null; bestHint = null;
      render();
      if (!getLegalMoves(board, turn).length) {
        return setStatus(turn === 1 ? "Победа черных!" : "Победа белых!");
      }
      if (turn === myColor) findBestMove();
      else setStatus("Сделайте ответный ход соперника на доске.");
    } else {
      setStatus(moves.some(m => m.captured.length > 0) ? "Бить обязательно!" : "Невозможный ход.");
    }
  }
}

function getLegalMoves(b, side) {
  let caps = new Array(), quiet = new Array();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (Math.sign(b.at(r).at(c)) !== side) continue;
      caps.push(...getPieceCaptures(b, r, c, b.at(r).at(c)));
      if (!caps.length) quiet.push(...getPieceQuietMoves(b, r, c, b.at(r).at(c)));
    }
  }
  return caps.length ? caps : quiet;
}

function getPieceQuietMoves(b, r, c, piece) {
  const res = new Array(), isKing = Math.abs(piece) === 2;
  const dirs = isKing ? ALL_DIRS : (piece > 0 ? W_DIRS : B_DIRS);
for (const dir of dirs) {
let dr = dir.at(0), dc = dir.at(1);
let nr = r + dr, nc = c + dc;
while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && b.at(nr).at(nc) === 0) {
res.push({ from: { r, c }, to: { r: nr, c: nc }, captured: new Array(), path: new Array() });
if (!isKing) break;
nr += dr; nc += dc;
}
}
return res;
}
function getPieceCaptures(b, r, c, piece, vis = new Array()) {
const res = new Array(), isKing = Math.abs(piece) === 2, side = Math.sign(piece);
for (const dir of ALL_DIRS) {
let dr = dir.at(0), dc = dir.at(1);
let nr = r + dr, nc = c + dc;
if (!isKing) {
const jr = r + 2 * dr, jc = c + 2 * dc;
if (jr >= 0 && jr < 8 && jc >= 0 && jc < 8 && Math.sign(b.at(nr).at(nc)) === -side && b.at(jr).at(jc) === 0 && !vis.some(v => v.r === nr && v.c === nc)) {
const np = ((side === 1 && jr === 0) || (side === -1 && jr === 7)) ? side * 2 : piece;
const nb = b.map(row => row.slice()); nb.at(r)[c] = 0; nb.at(jr)[jc] = np;
const sub = getPieceCaptures(nb, jr, jc, np, new Array(...vis, { r: nr, c: nc }));
if (sub.length) sub.forEach(s => res.push({ from: { r, c }, to: s.to, captured: new Array({ r: nr, c: nc }, ...s.captured), path: new Array({ r: jr, c: jc }, ...s.path) }));
else res.push({ from: { r, c }, to: { r: jr, c: jc }, captured: new Array({ r: nr, c: nc }), path: new Array() });
}
} else {
while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && b.at(nr).at(nc) === 0) { nr += dr; nc += dc; }
if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && Math.sign(b.at(nr).at(nc)) === -side && !vis.some(v => v.r === nr && v.c === nc)) {
let jr = nr + dr, jc = nc + dc;
while (jr >= 0 && jr < 8 && jc >= 0 && jc < 8 && b.at(jr).at(jc) === 0) {
const nb = b.map(row => row.slice()); nb.at(r)[c] = 0; nb.at(jr)[jc] = piece;
const sub = getPieceCaptures(nb, jr, jc, piece, new Array(...vis, { r: nr, c: nc }));
if (sub.length) sub.forEach(s => res.push({ from: { r, c }, to: s.to, captured: new Array({ r: nr, c: nc }, ...s.captured), path: new Array({ r: jr, c: jc }, ...s.path) }));
else res.push({ from: { r, c }, to: { r: jr, c: jc }, captured: new Array({ r: nr, c: nc }), path: new Array() });
jr += dr; jc += dc;
}
}
}
}
return res;
}
function applyMove(b, m) {
const nb = b.map(row => row.slice());
let p = nb.at(m.from.r).at(m.from.c);
nb.at(m.from.r)[m.from.c] = 0;
m.captured.forEach(cap => nb.at(cap.r)[cap.c] = 0);
if (p === 1 && m.to.r === 0) p = 2;
if (p === -1 && m.to.r === 7) p = -2;
nb.at(m.to.r)[m.to.c] = p;
return nb;
}
function evaluate(b) {
let s = 0;
for (let r = 0; r < 8; r++) {
for (let c = 0; c < 8; c++) {
const p = b.at(r).at(c);
if (!p) continue;
const cb = (c >= 2 && c <= 5 && r >= 2 && r <= 5) ? 14 : (c >= 1 && c <= 6 ? 6 : 0);
if (p === 1) s += 100 + (7 - r) * 8 + cb + (r === 7 && (c === 2 || c === 6) ? 12 : 0);
else if (p === 2) s += 360 + (r === c || r + c === 7 ? 25 : 0);
else if (p === -1) s -= 100 + r * 8 + cb + (r === 0 && (c === 1 || c === 5) ? 12 : 0);
else if (p === -2) s -= 360 + (r === c || r + c === 7 ? 25 : 0);
}
}
return s;
}
function sortMoves(moves, side) {
return moves.sort((a, b) => {
const cd = b.captured.length - a.captured.length;
if (cd !== 0) return cd;
const pA = (side === 1 && a.to.r === 0) || (side === -1 && a.to.r === 7) ? 1 : 0;
const pB = (side === 1 && b.to.r === 0) || (side === -1 && b.to.r === 7) ? 1 : 0;
return pB - pA;
});
}
function alphabeta(b, depth, alpha, beta, max) {
const side = max ? 1 : -1;
let moves = getLegalMoves(b, side);
if (!moves.length) return max ? -10000 - depth : 10000 + depth;
if (depth === 0) return evaluate(b);
moves = sortMoves(moves, side);
if (max) {
let v = -Infinity;
for (const m of moves) {
v = Math.max(v, alphabeta(applyMove(b, m), depth - 1, alpha, beta, false));
alpha = Math.max(alpha, v);
if (beta <= alpha) break;
}
return v;
} else {
let v = Infinity;
for (const m of moves) {
v = Math.min(v, alphabeta(applyMove(b, m), depth - 1, alpha, beta, true));
beta = Math.min(beta, v);
if (beta <= alpha) break;
}
return v;
}
}
function findBestMove() {
setStatus("Расчет лучшего хода...");
setTimeout(() => {
let moves = getLegalMoves(board, turn);
if (!moves.length) return setStatus("Нет доступных ходов!");
if (moves.length === 1) {
bestHint = moves.at(0);
setStatus("Единственный обязательный ход.");
return render();
}
moves = sortMoves(moves, turn);
let bestMove = moves.at(0), bestVal = turn === 1 ? -Infinity : Infinity;
for (const m of moves) {
const val = alphabeta(applyMove(board, m), MAX_DEPTH - 1, -Infinity, Infinity, turn === -1);
if ((turn === 1 && val > bestVal) || (turn === -1 && val < bestVal)) {
bestVal = val; bestMove = m;
}
}
bestHint = bestMove;
const cols = "abcdefgh";
setStatus(Лучший ход: ${cols.at(bestMove.from.c)}${8 - bestMove.from.r} → ${cols.at(bestMove.to.c)}${8 - bestMove.to.r} (${(bestVal / 100).toFixed(2)}));
render();
}, 20);
}
resetBoard();
