
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANALYZATOR</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 20%, #172554 0%, #0f172a 55%, #020617 100%);
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 12px;
    box-sizing: border-box;
  }
  .logo {
    margin: 0 0 14px;
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #60a5fa, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 24px rgba(56, 189, 248, 0.35);
  }
  .board-wrap {
    position: relative;
    width: 440px;
    height: 440px;
    max-width: 92vw;
    max-height: 92vw;
    border: 4px solid rgba(59, 130, 246, 0.4);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    background: #1e293b;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    height: 100%;
    user-select: none;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
    height: 100%;
  }
  .light { background: #e2e8f0; }
  .dark { background: #475569; cursor: pointer; }
  .selected { box-shadow: inset 0 0 0 4px #facc15; }
  .must-capture { box-shadow: inset 0 0 0 3px #f43f5e; }
  .piece {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.35rem;
    pointer-events: none;
    z-index: 2;
  }
  .white {
    background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
    color: #0f172a;
    border: 2px solid #94a3b8;
  }
  .black {
    background: radial-gradient(circle at 30% 30%, #334155, #090d16);
    color: #38bdf8;
    border: 2px solid #020617;
  }
  svg.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  .controls {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 465px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(10px);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(59, 130, 246, 0.25);
  }
  button, select {
    padding: 10px 14px;
    font-size: 0.92rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.1s, background 0.2s;
  }
  button:active { transform: scale(0.97); }
  .btn-go {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #ffffff;
    border: 1px solid #60a5fa;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
  }
  .btn-sec {
    background: linear-gradient(135deg, #1e3a8a, #172554);
    color: #dbeafe;
    border: 1px solid rgba(96, 165, 250, 0.35);
  }
  select {
    background: #172554;
    color: #eff6ff;
    border: 1px solid rgba(96, 165, 250, 0.45);
  }
  .status {
    margin-top: 12px;
    font-size: 0.96rem;
    color: #60a5fa;
    text-align: center;
    min-height: 22px;
    font-weight: 500;
  }
</style>
</head>
<body>

<h1 class="logo">ANALYZATOR</h1>

<div class="board-wrap">
  <div class="board" id="board"></div>
  <svg class="overlay" viewBox="0 0 800 800">
    <defs>
      <marker id="ah" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto">
        <polygon points="0 0, 6 3, 0 6" fill="#38bdf8" />
      </marker>
    </defs>
    <g id="arrows"></g>
  </svg>
</div>

<div class="controls">
  <select id="myColorSelect" onchange="changeMyColor()">
    <option value="1">Я играю: Белыми</option>
    <option value="-1">Я играю: Черными</option>
  </select>
  <button class="btn-go" onclick="findBestMove()">Подсказать ход</button>
  <button class="btn-sec" onclick="undoMove()">Назад</button>
  <button class="btn-sec" onclick="resetBoard()">Сброс</button>
  <button class="btn-sec" id="editBtn" onclick="toggleEdit()">Расстановка: ВЫКЛ</button>
</div>
<div class="status" id="status"></div>

<script>
let board = new Array(64).fill(0);
let turn = 1;
let myColor = 1;
let selected = null;
let bestHint = null;
let editMode = false;
let history = new Array();

const MAX_DEPTH = 6;
const ALL_DIRS = new Array(
  { dr: -1, dc: -1 },
  { dr: -1, dc: 1 },
  { dr: 1, dc: -1 },
  { dr: 1, dc: 1 }
);
const W_DIRS = new Array({ dr: -1, dc: -1 }, { dr: -1, dc: 1 });
const B_DIRS = new Array({ dr: 1, dc: -1 }, { dr: 1, dc: 1 });

function idx(r, c) { return r * 8 + c; }
function inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

function saveHistory() {
  history.push({ board: board.slice(), turn: turn });
  if (history.length > 60) history.shift();
}

function undoMove() {
  if (!history.length) return setStatus("Нечего отменять.");
  const prev = history.pop();
  board = prev.board;
  turn = prev.turn;
  selected = null;
  bestHint = null;
  setStatus(turn === 1 ? "Ход белых." : "Ход черных.");
  render();
  if (turn === myColor && !editMode) findBestMove();
}

function resetBoard() {
  board = new Array(64).fill(0);
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if ((r + c) % 2 === 1) {
        if (r < 3) board[idx(r, c)] = -1;
        else if (r > 4) board[idx(r, c)] = 1;
      }
    }
  }
  turn = 1;
  history = new Array();
  selected = null;
  bestHint = null;
  setStatus(turn === myColor ? "Ваш ход." : "Сделайте ход белых на доске.");
  render();
  if (turn === myColor) findBestMove();
}

function changeMyColor() {
  myColor = parseInt(document.getElementById("myColorSelect").value, 10);
  selected = null;
  bestHint = null;
  render();
  if (turn === myColor && !editMode) findBestMove();
  else if (!editMode) setStatus("Сделайте ход соперника на доске.");
}

function toggleEdit() {
  editMode = !editMode;
  selected = null;
  bestHint = null;
  const btn = document.getElementById("editBtn");
  btn.textContent = editMode ? "Расстановка: ВКЛ" : "Расстановка: ВЫКЛ";
  btn.style.background = editMode ? "#2563eb" : "";
  if (!editMode) {
    turn = myColor;
    setStatus("Ваш ход.");
    render();
    findBestMove();
  } else {
    setStatus("Кликайте по темным клеткам: Белая → Дамка → Черная → Дамка → Пусто");
    render();
  }
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function toScreen(r, c) {
  return myColor === 1 ? { sr: r, sc: c } : { sr: 7 - r, sc: 7 - c };
}

function toBoard(sr, sc) {
  return myColor === 1 ? { r: sr, c: sc } : { r: 7 - sr, c: 7 - sc };
}

function drawArrow(move) {
  const g = document.getElementById("arrows");
  g.innerHTML = "";
  if (!move || !move.from || !move.to) return;
  const pts = new Array(move.from).concat(move.path || new Array()).concat(new Array(move.to));
  for (let i = 0; i < pts.length - 1; i++) {
    const p
