<script>
(()=>{const tg=window.Telegram?.WebApp;if(tg){try{tg.ready();tg.expand();tg.setHeaderColor?.("#090b0e");tg.setBackgroundColor?.("#090b0e");tg.disableVerticalSwipes?.()}catch(e){}}})();
"use strict";
const $=id=>document.getElementById(id), dirs=[[-1,-1],[-1,1],[1,-1],[1,1]], idx=(r,c)=>r*8+c, rc=i=>[i>>3,i&7], inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8, sgn=Math.sign, isKing=p=>Math.abs(p)===2;
let board,turn=1,myColor=1,selected=null,hint=null,history=[],worker=null,thinking=false,requestId=0,analysisBudget=1000,pendingCapture=null,moveAnimation=null,animating=false;
function startBoard(){const b=Array(64).fill(0);for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)&1)b[idx(r,c)]=-1;for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)&1)b[idx(r,c)]=1;return b}
function coord(i){const [r,c]=rc(i);return "abcdefgh"[c]+(8-r)}
function count(){let w=0,k=0;for(const p of board){if(p>0)w++;if(p<0)k++}return [w,k]}
function captureMoves(b,player){const out=[];for(let start=0;start<64;start++)if(sgn(b[start])===player){const initial=b[start];function dfs(pos,cur,used,path,caps,piece){const [r,c]=rc(pos);let extended=false;for(const [dr,dc] of dirs){if(!isKing(piece)){const mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc;if(!inside(mr,mc)||!inside(lr,lc))continue;const v=idx(mr,mc),to=idx(lr,lc);if(sgn(cur[v])!==-player||used.has(v)||cur[to]!==0)continue;extended=true;const nb=cur.slice();nb[pos]=0;nb[v]=0;let np=piece;if((player===1&&lr===0)||(player===-1&&lr===7))np=player*2;nb[to]=np;const nu=new Set(used);nu.add(v);dfs(to,nb,nu,path.concat(to),caps.concat(v),np)}else{let rr=r+dr,cc=c+dc;while(inside(rr,cc)&&cur[idx(rr,cc)]===0){rr+=dr;cc+=dc}if(!inside(rr,cc))continue;const v=idx(rr,cc);if(sgn(cur[v])!==-player||used.has(v))continue;rr+=dr;cc+=dc;while(inside(rr,cc)&&cur[idx(rr,cc)]===0){const to=idx(rr,cc);extended=true;const nb=cur.slice();nb[pos]=0;nb[v]=0;nb[to]=piece;const nu=new Set(used);nu.add(v);dfs(to,nb,nu,path.concat(to),caps.concat(v),piece);rr+=dr;cc+=dc}}}if(!extended&&caps.length)out.push({from:start,to:pos,path:path.slice(),captures:caps.slice(),board:cur})}dfs(start,b.slice(),new Set(),[],[],initial)}return out}
function quietMoves(b,player){const out=[];for(let i=0;i<64;i++)if(sgn(b[i])===player){const [r,c]=rc(i),p=b[i];if(isKing(p)){for(const [dr,dc] of dirs){let rr=r+dr,cc=c+dc;while(inside(rr,cc)&&b[idx(rr,cc)]===0){const to=idx(rr,cc),nb=b.slice();nb[to]=p;nb[i]=0;out.push({from:i,to,path:[to],captures:[],board:nb});rr+=dr;cc+=dc}}}else{const dr=player===1?-1:1;for(const dc of [-1,1]){const rr=r+dr,cc=c+dc;if(inside(rr,cc)&&b[idx(rr,cc)]===0){const to=idx(rr,cc),nb=b.slice();nb[to]=p;nb[i]=0;if((player===1&&rr===0)||(player===-1&&rr===7))nb[to]=player*2;out.push({from:i,to,path:[to],captures:[],board:nb})}}}}return out}
function moves(b,p){const c=captureMoves(b,p);return c.length?c:quietMoves(b,p)}
function save(){history.push({board:board.slice(),turn});if(history.length>100)history.shift()}
function status(t){$("status").textContent=t;$("status").classList.toggle("analyzing",thinking)}
function nextDestinations(){
  if(pendingCapture)return pendingCapture.candidates.map(m=>m.path[pendingCapture.step]);
  return selected===null?[]:moves(board,turn).filter(m=>m.from===selected).map(m=>m.path[0]);
}
function render(motion){
  cancelMoveAnimation();
  const root=$("board");root.innerHTML="";const legal=nextDestinations();let movingPiece=null;
  for(let sr=0;sr<8;sr++)for(let sc=0;sc<8;sc++){
    const r=myColor===1?sr:7-sr,c=myColor===1?sc:7-sc,i=idx(r,c),cell=document.createElement("div");
    cell.className="cell "+(((r+c)&1)?"dark":"light");
    cell.setAttribute("role","button");cell.setAttribute("tabindex","0");cell.setAttribute("aria-label",coord(i));
    if(selected===i)cell.classList.add("selected");
    if(hint){if(hint.from===i)cell.classList.add("from");if(hint.path.includes(i))cell.classList.add("to")}
    if(legal.includes(i))cell.classList.add("legal");
    if(board[i]){const pc=document.createElement("div");pc.className="piece "+(board[i]>0?"white":"black")+(isKing(board[i])?" king":"");cell.appendChild(pc);if(motion&&i===motion.to)movingPiece=pc;}
    if(sc===0){const label=document.createElement("span");label.className="square-label rank";label.textContent=8-r;cell.appendChild(label)}
    if(sr===7){const label=document.createElement("span");label.className="square-label file";label.textContent="abcdefgh"[c];cell.appendChild(label)}
    cell.addEventListener("click",()=>clickCell(i));cell.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();clickCell(i)}});root.appendChild(cell);
  }
  drawArrow();updatePanel();
  if(motion)animateMove(movingPiece,motion);
}
function cancelMoveAnimation(){
  const previous=moveAnimation;moveAnimation=null;animating=false;
  if(previous)previous.cancel();
}
function animateMove(piece,motion){
  if(!piece?.animate||window.matchMedia?.("(prefers-reduced-motion: reduce)").matches)return;
  const size=$("board").getBoundingClientRect().width/8,orientation=myColor===1?1:-1;
  const dx=((motion.from&7)-(motion.to&7))*size*orientation,dy=((motion.from>>3)-(motion.to>>3))*size*orientation;
  animating=true;
  const animation=piece.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"translate(0px,0px)"}],{duration:220,easing:"cubic-bezier(.22,.72,.2,1)"});
  moveAnimation=animation;
  const complete=()=>{if(moveAnimation===animation){moveAnimation=null;animating=false;updatePanel();}};
  animation.onfinish=complete;animation.oncancel=complete;updatePanel();
}
function drawArrow(){
  const g=$("arrows");g.innerHTML="";if(!hint)return;
  const pts=[hint.from,...hint.path].map(i=>{let [r,c]=rc(i);if(myColor===-1){r=7-r;c=7-c}return [(c+.5)*100,(r+.5)*100]});
  if(pts.length<2)return;
  const ns="http://www.w3.org/2000/svg";
  const add=(tag,attrs)=>{const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);g.appendChild(el);return el;};
  const trim=(a,b,n)=>{const len=Math.hypot(b[0]-a[0],b[1]-a[1]);return [a[0]+(b[0]-a[0])*n/len,a[1]+(b[1]-a[1])*n/len];};
  const route=pts.map(p=>p.slice());route[0]=trim(pts[0],pts[1],42);route[route.length-1]=trim(pts.at(-1),pts.at(-2),30);
  let d=`M ${route[0].join(" ")}`;
  for(let i=1;i<route.length;i++){
    const a=route[i-1],b=route[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),bend=Math.min(14,len*.08);
    const cx=(a[0]+b[0])/2-dy/len*bend,cy=(a[1]+b[1])/2+dx/len*bend;
    d+=` Q ${cx} ${cy} ${b[0]} ${b[1]}`;
  }
  add("path",{d,fill:"none",stroke:"url(#ag)","stroke-width":9,opacity:.62,"stroke-linecap":"round","stroke-linejoin":"round","marker-end":"url(#ah)"});
  for(let i=1;i<pts.length-1;i++){
    add("circle",{cx:pts[i][0],cy:pts[i][1],r:12,fill:"#253348",stroke:"#60a5fa","stroke-width":2});
    const text=add("text",{x:pts[i][0],y:pts[i][1]+5,"text-anchor":"middle",fill:"#93c5fd","font-size":15,"font-family":"system-ui","font-weight":700});text.textContent=i;
  }
}
function cancelAnalysis(){cancelMoveAnimation();if(worker){worker.terminate();worker=null}thinking=false;requestId++;}
function updatePanel(){const [w,b]=count();$("wc").textContent=w;$("bc").textContent=b;$("mySide").textContent=myColor===1?"Белые":"Чёрные";$("whose").textContent=turn===1?"Белые":"Чёрные";$("turnLabel").textContent=turn===myColor?"ТВОЙ ХОД":"ХОД СОПЕРНИКА";$("whiteChoice").classList.toggle("active",myColor===1);$("blackChoice").classList.toggle("active",myColor===-1);$("hintBtn").disabled=thinking||animating||turn!==myColor||Boolean(pendingCapture)}
function finishMove(motion){
  pendingCapture=null;turn=-turn;selected=null;hint=null;render(motion);
  if(turn===myColor)autoHint();else status("Ход записан. Ожидаю ход соперника.");
}
function advanceCapture(to){
  const sequence=pendingCapture,step=sequence.step;
  const candidates=sequence.candidates.filter(m=>m.path[step]===to);
  if(!candidates.length){status("Продолжи взятие: нажми на подсвеченную клетку.");return;}
  const from=selected,move=candidates[0],piece=board[selected],row=to>>3;
  board=board.slice();board[selected]=0;board[move.captures[step]]=0;
  board[to]=!isKing(piece)&&((turn===1&&row===0)||(turn===-1&&row===7))?turn*2:piece;
  sequence.candidates=candidates;sequence.step++;selected=to;
  const completed=candidates.find(m=>m.path.length===sequence.step);
  if(completed){board=completed.board.slice();finishMove({from,to});return;}
  render({from,to});status("Взято: "+sequence.step+". Продолжи этой шашкой — выбери следующую подсвеченную клетку.");
}
function clickCell(i){
  if(thinking||animating||(rc(i)[0]+rc(i)[1])%2===0)return;
  if(pendingCapture){advanceCapture(i);return;}
  if(selected!==null){
    const candidates=moves(board,turn).filter(m=>m.from===selected&&m.path[0]===i);
    if(candidates.length){
      cancelAnalysis();save();hint=null;
      if(candidates[0].captures.length){pendingCapture={candidates,step:0};advanceCapture(i)}
      else{board=candidates[0].board.slice();finishMove({from:candidates[0].from,to:i})}
      return;
    }
  }
  if(sgn(board[i])===turn){cancelAnalysis();selected=i;hint=null;render();status("Выбери подсвеченную клетку. В серии взятий нажимай каждое приземление по очереди.")}
  else{selected=null;render()}
}
function analyze(){if(turn!==myColor||thinking||animating||pendingCapture)return;if(!worker){try{worker=new Worker("engine-worker.js?v=4")}catch(e){status("Не удалось запустить движок: "+e.message);return}worker.onmessage=e=>{const d=e.data;if(d.requestId!==requestId)return;if(d.partial){$("depth").textContent=d.move.depth;$("nodes").textContent=Number(d.move.nodes||0).toLocaleString("ru-RU");status("Проверяю варианты… Глубина "+d.move.depth+".");return;}thinking=false;if(d.error){thinking=false;status("Ошибка движка: "+d.error);render();return}if(!d.move){thinking=false;render();status("У тебя нет допустимых ходов. Партия окончена.");return}hint=d.move;$("depth").textContent=d.move.depth;$("nodes").textContent=Number(d.move.nodes||0).toLocaleString("ru-RU");render();const route=[d.move.from,...d.move.path].map(coord).join(" → ");status(`Рекомендуемый ход: ${route}. Глубина ${d.move.depth}. Можно ходить.`)};worker.onerror=e=>{thinking=false;status("Ошибка Worker. Проверь, что engine-worker.js загружен рядом с index.html.");}}
thinking=true;hint=null;selected=null;render();status("Ищу сильное продолжение… Стрелка появится после проверки.");requestId++;worker.postMessage({board:board.slice(),player:turn,budgetMs:analysisBudget,requestId})}
function autoHint(){if(turn===myColor&&!thinking)setTimeout(()=>{if(turn===myColor&&!thinking){if(animating)autoHint();else analyze();}},120)}
function setAnalysisMode(budget){
  if(pendingCapture){status("Сначала заверши серию взятий или нажми «Отменить».");return;}
  cancelAnalysis();analysisBudget=budget;
  for(const [id,active] of [["fastMode",budget===1000],["deepMode",budget===4500]]){$(id).classList.toggle("active",active);$(id).setAttribute("aria-pressed",String(active));}
  if(turn===myColor)analyze();else status("Режим анализа изменён. Ожидаю ход соперника.");
}
$("fastMode").onclick=()=>setAnalysisMode(1000);$("deepMode").onclick=()=>setAnalysisMode(4500);
function setColor(c){if(pendingCapture){status("Сначала заверши серию взятий или нажми «Отменить».");return;}cancelAnalysis();myColor=c;selected=null;hint=null;render();if(turn===myColor)autoHint();else status("Ожидаю ход соперника. После его хода подсказка появится автоматически.")}
$("whiteChoice").onclick=()=>setColor(1);$("blackChoice").onclick=()=>setColor(-1);$("hintBtn").onclick=analyze;
$("undoBtn").onclick=()=>{cancelAnalysis();if(!history.length){status("Пока нечего отменять.");return}const s=history.pop();pendingCapture=null;board=s.board;turn=s.turn;hint=null;selected=null;render();status(turn===myColor?"Твой ход.":"Ход соперника.")};
$("newBtn").onclick=()=>{cancelAnalysis();pendingCapture=null;board=startBoard();turn=1;history=[];hint=null;selected=null;$("depth").textContent="—";$("nodes").textContent="—";render();if(turn===myColor)autoHint();else status("Новая партия. Ожидаю ход соперника.")};
board=startBoard();render();status("Выбери сторону и запиши ход на доске.");
</script></body></html>
